<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReparteJusto | Reparto transparente de propinas</title>
    
    <!-- CSS Crítico Inline (Above-the-fold) -->
    <style>
      /* Reset y variables críticas */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      :root{--radius:0.625rem;--background:#1a1a2e;--foreground:#e0e0e0;--card:#2a2a4a;--card-foreground:#d0d0d0;--popover:#2a2a4a;--popover-foreground:#d0d0d0;--primary:#7c3aed;--primary-foreground:#ffffff;--secondary:#2a2a4a;--secondary-foreground:#d0d0d0;--muted:#2a2a4a;--muted-foreground:#a0a0a0;--accent:#7c3aed;--accent-foreground:#ffffff;--destructive:#ef4444;--border:#3a3a5a;--input:#3a3a5a;--ring:#7c3aed}
      body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.5;color:#e0e0e0;background-color:#1a1a2e}
      
      /* Layout crítico */
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem;max-width:1200px}
      @media (min-width:640px){.container{max-width:640px}}@media (min-width:768px){.container{max-width:768px}}@media (min-width:1024px){.container{max-width:1024px}}@media (min-width:1280px){.container{max-width:1280px}}
      
      /* Navegación crítico - CLASES ESENCIALES */
      header{position:sticky;top:0;z-index:50;width:100%;border-bottom:1px solid rgba(255,255,255,0.1);background:linear-gradient(to right,rgba(15,23,42,0.9),rgba(30,41,59,0.8),rgba(15,23,42,0.9));backdrop-filter:blur(12px);box-shadow:0 10px 35px rgba(8,15,40,0.55)}
      .header-container{display:flex;height:72px;align-items:center;justify-content:space-between;padding:0 1rem}
      @media (min-width:768px){.header-container{padding:0 1.5rem}}
      .logo-link{display:flex;align-items:center;gap:0.5rem;font-size:1.125rem;font-weight:600;letter-spacing:-0.025em;color:#ffffff;text-decoration:none}
      .logo-badge{display:inline-flex;border-radius:9999px;background-color:rgba(255,255,255,0.2);padding:0.25rem 0.75rem;font-size:0.875rem;font-weight:700;color:#0f172a}
      .logo-text{font-size:1.25rem;font-weight:700;color:#ffffff;text-shadow:0 2px 15px rgba(0,0,0,0.35)}
      .nav-desktop{display:none;align-items:center;gap:1.5rem}
      @media (min-width:768px){.nav-desktop{display:flex}}
      .nav-link{position:relative;font-size:1rem;font-weight:600;letter-spacing:0.025em;color:rgba(255,255,255,0.8);transition:all 0.2s;text-decoration:none}
      .nav-link:hover{color:#ffffff}
      .nav-link::after{content:'';position:absolute;left:0;right:0;bottom:-0.25rem;height:2px;border-radius:9999px;background:#ffffff;opacity:0;transition:opacity 0.2s}
      .nav-link:hover::after{opacity:1}
      .nav-mobile-btn{display:inline-flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(255,255,255,0.15);color:#ffffff;box-shadow:0 4px 6px -1px rgba(0,0,0,0.3),0 2px 4px -1px rgba(0,0,0,0.2);transition:all 0.2s;background:none;cursor:pointer}
      .nav-mobile-btn:hover{border-color:rgba(124,58,237,0.6)}
      @media (min-width:768px){.nav-mobile-btn{display:none}}
      
      /* Botones críticos */
      .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:0.75rem 1.5rem;font-weight:500;text-decoration:none;transition:all 0.2s;cursor:pointer;border:1px solid transparent}
      .btn-primary{background-color:#7c3aed;color:#ffffff}
      .btn-primary:hover{background-color:#6d28d9}
      .btn-ghost{background-color:transparent;color:rgba(255,255,255,0.8)}
      .btn-ghost:hover{background-color:rgba(255,255,255,0.1);color:#ffffff}
      .btn-sm{padding:0.5rem 1rem;font-size:0.875rem}
      
      /* Hero section crítico */
      .hero-gradient{background:linear-gradient(to bottom,#1a1a2e,rgba(255,255,255,0.05))}
      .hero-title{font-size:1.875rem;font-weight:700;line-height:1.2;color:#e0e0e0;margin:0}
      @media (min-width:640px){.hero-title{font-size:2.25rem}}@media (min-width:768px){.hero-title{font-size:3rem}}@media (min-width:1024px){.hero-title{font-size:3.75rem}}@media (min-width:1280px){.hero-title{font-size:4rem}}
      .hero-text{font-size:1rem;line-height:1.5;color:#a0a0a0}
      @media (min-width:640px){.hero-text{font-size:1.125rem}}@media (min-width:768px){.hero-text{font-size:1.25rem}}@media (min-width:1024px){.hero-text{font-size:1.5rem}}
      
      /* Loading state */
      .loading{display:flex;align-items:center;justify-content:center;height:100vh;background-color:#1a1a2e}
      .spinner{width:2rem;height:2rem;border:2px solid #3a3a5a;border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      
      /* Ocultar contenido hasta que cargue */
      .hidden{display:none}
      .ready{display:block}
    </style>
    
    <!-- Preload CSS principal -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/src/index.css" /></noscript>
  </head>
  <body>
    <div id="root">
      <!-- Loading crítico -->
      <div class="loading" id="initial-loading">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Eliminar loading cuando React esté listo
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loading = document.getElementById('initial-loading');
          if (loading) loading.style.display = 'none';
        }, 100);
      });
    </script>
  </body>
</html>
